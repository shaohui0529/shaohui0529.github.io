<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>优势测评 - 阿优</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-width: 420px;
    width: 100%;
    height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 20px;
    text-align: center;
  }
  .header h1 { font-size: 22px; margin-bottom: 5px; }
  .header p { font-size: 13px; opacity: 0.9; }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: #f8f9fa;
  }
  .message {
    margin-bottom: 15px;
    display: flex;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.user { justify-content: flex-end; }
  .message.bot { justify-content: flex-start; }
  .bubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.6;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .message.user .bubble {
    background: #667eea;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .message.bot .bubble {
    background: white;
    color: #333;
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .typing {
    display: inline-block;
    padding: 12px 16px;
    background: white;
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .typing span {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #667eea;
    border-radius: 50%;
    margin: 0 2px;
    animation: bounce 1.4s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-fill-mode: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }
  .input-area {
    padding: 15px 20px;
    background: white;
    border-top: 1px solid #eee;
    display: flex;
    gap: 10px;
  }
  .input-area input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 25px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.3s;
  }
  .input-area input:focus { border-color: #667eea; }
  .input-area button {
    padding: 12px 24px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 25px;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .input-area button:hover { transform: scale(1.05); }
  .input-area button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  .error-msg {
    background: #ffebee;
    color: #c62828;
    padding: 12px;
    border-radius: 8px;
    margin: 10px 20px;
    font-size: 13px;
    display: none;
  }
  .error-msg.show { display: block; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🌟 阿优</h1>
    <p>你的优势探索伙伴 · 10分钟发现你的天赋</p>
  </div>
  
  <div class="error-msg" id="errorMsg"></div>
  
  <div class="messages" id="messages"></div>
  
  <div class="input-area">
    <input type="text" id="userInput" placeholder="输入你的回答..." onkeypress="handleKeyPress(event)">
    <button id="sendBtn" onclick="sendMessage()">发送</button>
  </div>
</div>

<script>
const BOT_ID = '7695787574597697571';
const API_TOKEN = 'pat_eoSSHV7NfH2OweB3DT9Ue9DH5OEoUAN4q8BXA2v4A5CjSlQIjsDyOd4JRCjLUiYZ';
const API_BASE = 'https://api.coze.cn';

let conversationId = null;
let isProcessing = false;

function showError(msg) {
  const errorEl = document.getElementById('errorMsg');
  errorEl.textContent = '⚠️ ' + msg;
  errorEl.classList.add('show');
  setTimeout(() => errorEl.classList.remove('show'), 5000);
}

function addMessage(role, content) {
  const messagesDiv = document.getElementById('messages');
  const msgDiv = document.createElement('div');
  msgDiv.className = 'message ' + role;
  
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  
  msgDiv.appendChild(bubble);
  messagesDiv.appendChild(msgDiv);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function showTyping() {
  const messagesDiv = document.getElementById('messages');
  const msgDiv = document.createElement('div');
  msgDiv.className = 'message bot';
  msgDiv.id = 'typingIndicator';
  
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  
  msgDiv.appendChild(typing);
  messagesDiv.appendChild(msgDiv);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function hideTyping() {
  const typing = document.getElementById('typingIndicator');
  if (typing) typing.remove();
}

function handleKeyPress(event) {
  if (event.key === 'Enter' && !isProcessing) {
    sendMessage();
  }
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const text = input.value.trim();
  
  if (!text || isProcessing) return;
  
  isProcessing = true;
  sendBtn.disabled = true;
  input.value = '';
  
  addMessage('user', text);
  showTyping();
  
  try {
    const requestBody = {
      bot_id: BOT_ID,
      user_id: 'user_' + Date.now(),
      stream: false,
      auto_save_history: true,
      additional_messages: [
        {
          role: 'user',
          content: text,
          content_type: 'text'
        }
      ]
    };
    
    if (conversationId) {
      requestBody.conversation_id = conversationId;
    }
    
    const response = await fetch(API_BASE + '/v3/chat', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + API_TOKEN,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(requestBody)
    });
    
    const data = await response.json();
    
    hideTyping();
    
    if (data.code === 0 && data.data) {
      conversationId = data.data.conversation_id;
      const chatId = data.data.id;
      
      // 等待对话完成
      await pollChatResult(conversationId, chatId);
    } else {
      addMessage('bot', '抱歉，我好像走神了🤔 能再说一遍吗？');
      console.error('API Error:', data);
    }
  } catch (err) {
    hideTyping();
    console.error('Error:', err);
    showError('网络连接失败，请检查网络后重试');
    addMessage('bot', '网络好像出了点问题，稍后再试一下吧～');
  } finally {
    isProcessing = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

async function pollChatResult(convId, chatId) {
  const maxAttempts = 30;
  let attempts = 0;
  
  while (attempts < maxAttempts) {
    await new Promise(resolve => setTimeout(resolve, 1000));
    attempts++;
    
    try {
      const response = await fetch(API_BASE + '/v3/chat/retrieve?conversation_id=' + convId + '&chat_id=' + chatId, {
        headers: {
          'Authorization': 'Bearer ' + API_TOKEN,
          'Content-Type': 'application/json'
        }
      });
      
      const data = await response.json();
      
      if (data.code === 0 && data.data) {
        const status = data.data.status;
        
        if (status === 'completed') {
          await getMessages(convId, chatId);
          return;
        } else if (status === 'failed') {
          addMessage('bot', '抱歉，我这边出了点问题，稍后再试一下吧～');
          return;
        }
      }
    } catch (err) {
      console.error('Poll error:', err);
    }
  }
  
  addMessage('bot', '回复超时了，请再试一次～');
}

async function getMessages(convId, chatId) {
  try {
    const response = await fetch(API_BASE + '/v3/chat/message/list?conversation_id=' + convId + '&chat_id=' + chatId, {
      headers: {
        'Authorization': 'Bearer ' + API_TOKEN,
        'Content-Type': 'application/json'
      }
    });
    
    const data = await response.json();
    
    if (data.code === 0 && data.data) {
      const messages = data.data;
      const lastAssistant = messages.filter(m => m.role === 'assistant' && m.content && !m.content.includes('msg_type')).pop();
      
      if (lastAssistant && lastAssistant.content) {
        addMessage('bot', lastAssistant.content);
      }
    }
  } catch (err) {
    console.error('Get messages error:', err);
  }
}

// 初始化
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('userInput').focus();
  addMessage('bot', '你好呀！我是阿优，你的优势探索伙伴🌟\n\n今天咱们轻松聊聊天，帮我了解你，也帮你发现自己的优势。\n\n先聊几个简单的问题，好吗？\n\n你平时是更喜欢独处思考，还是跟人碰撞想法？');
});
</script>
</body>
</html>
